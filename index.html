<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HumTune</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060a07; --bg-2: #0b0f0a; --surface: #12160f; --surface-2: #1a2117;
    --border: #263023; --text: #eef2ea; --text-dim: #8b9587;
    --accent: #35e07a; --accent-strong: #21c465; --accent-ink: #04150a;
    --glow: rgba(53,224,122,0.35); --warn: #ffb648; --danger: #ff5d6b;
    --font-scale: 16px;
  }
  :root[data-theme="light"] {
    --bg: #f5f7f3; --bg-2: #ffffff; --surface: #ffffff; --surface-2: #eef2ea;
    --border: #dde3d8; --text: #12160f; --text-dim: #5c665a;
    --accent: #1f9d55; --accent-strong: #167d43; --accent-ink: #ffffff;
    --glow: rgba(31,157,85,0.22); --warn: #b6740a; --danger: #c73e3e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: var(--font-scale); }
  html, body { margin:0; padding:0; height:100%; color:var(--text);
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overscroll-behavior-y:contain;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(53,224,122,0.16), transparent 60%),
      radial-gradient(ellipse 700px 400px at 90% 15%, rgba(53,224,122,0.06), transparent 55%),
      var(--bg);
    background-attachment: fixed;
  }
  html[data-theme="light"], body[data-theme="light"] { background: var(--bg); }
  html[data-theme="light"] body { background: var(--bg); }
  .reduced-motion * { animation:none !important; transition:none !important; }
  button, input, textarea { font-family:inherit; color:inherit; }
  #app { max-width:480px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; background:var(--bg); }

  .topbar { display:flex; align-items:center; gap:10px; padding:max(14px, env(safe-area-inset-top)) 16px 10px; }
  .tb-btn { width:36px; height:36px; border-radius:10px; border:none; background:var(--surface-2); color:var(--text); font-size:17px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .tb-title { flex:1; font-size:1.05rem; font-weight:700; letter-spacing:-0.01em; }

  #screen-root { flex:1; overflow-y:auto; padding:0 16px 18px; -webkit-overflow-scrolling:touch; }
  .home-top { padding:8px 16px 0; }
  .logo-row { display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  .logo-word { font-size:1.15rem; font-weight:800; letter-spacing:-0.02em; }
  .logo-word span { color:var(--accent); }

  .hero { text-align:center; padding:16px 8px 4px; }
  .hero h1 { font-size:1.5rem; font-weight:800; letter-spacing:-0.025em; margin:0 0 6px; line-height:1.25; background:linear-gradient(155deg, var(--text), var(--text) 60%, var(--accent)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .hero p { margin:0; color:var(--text-dim); font-size:0.9rem; }

  .hum-stage { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px 0 6px; position:relative; }
  #heroWave { width:100%; max-width:320px; height:80px; display:block; }
  .mic-wrap { position:relative; width:164px; height:164px; display:flex; align-items:center; justify-content:center; margin-top:-64px; }
  .pulse-ring { position:absolute; inset:0; border-radius:50%; border:2px solid var(--accent); opacity:0; }
  .mic-wrap.pulsing .pulse-ring { animation:pulse 2.2s ease-out infinite; }
  .mic-wrap.pulsing .pulse-ring:nth-child(2) { animation-delay:0.7s; }
  .mic-wrap.recording .pulse-ring { border-color:var(--danger); animation:pulse 1.3s ease-out infinite; }
  @keyframes pulse { 0%{transform:scale(0.72);opacity:0.5;} 100%{transform:scale(1.4);opacity:0;} }
  .big-mic { position:relative; z-index:2; width:136px; height:136px; border-radius:50%; border:none;
    background:radial-gradient(circle at 30% 25%, var(--accent-strong), #0a3d20 78%);
    box-shadow:0 0 0 1px rgba(53,224,122,0.25), 0 14px 40px var(--glow);
    color:var(--accent-ink); display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px; cursor:pointer; font-weight:700; font-size:0.82rem; }
  .big-mic .ic { font-size:36px; }
  .big-mic:active { transform:scale(0.96); }
  .mic-wrap.recording .big-mic { background:radial-gradient(circle at 30% 25%, var(--danger), #4a1013 78%); color:#fff; }

  .section-title { font-size:0.8rem; font-weight:700; color:var(--text-dim); margin:20px 2px 10px; }
  .h-scroll { display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
  .h-scroll::-webkit-scrollbar { display:none; }

  .card { position:relative; background:linear-gradient(155deg, var(--surface-2), var(--surface) 40%); border:1px solid var(--border); border-radius:16px; padding:14px; box-shadow:0 3px 14px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.04); }
  .mini-card { min-width:150px; }
  .mini-card canvas { width:100%; height:36px; display:block; margin:8px 0 6px; }
  .mini-card .mc-name { font-weight:700; font-size:0.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mini-card .mc-meta { font-size:0.7rem; color:var(--text-dim); }

  .empty-state { text-align:center; padding:30px 14px; }
  .empty-state .ico { font-size:32px; margin-bottom:10px; }
  .empty-state h3 { margin:0 0 6px; font-size:1rem; }
  .empty-state p { margin:0 0 16px; color:var(--text-dim); font-size:0.86rem; }

  .btn { border:none; border-radius:12px; padding:12px 16px; font-weight:700; font-size:0.86rem; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .btn:active { transform:scale(0.98); }
  .btn:disabled { opacity:0.4; cursor:not-allowed; }
  .btn-primary { background:linear-gradient(155deg, var(--accent), var(--accent-strong)); color:var(--accent-ink); box-shadow:0 4px 14px var(--glow); }
  .btn-secondary { background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
  .btn-enhance { background:linear-gradient(155deg, #2a5a3f, #163b28); color:#fff; border:1px solid var(--accent); box-shadow:0 4px 16px var(--glow), inset 0 1px 0 rgba(255,255,255,0.08); font-weight:800; }
  .btn-danger { background:var(--danger); color:#fff; }
  .btn-block { width:100%; }
  .btn-row { display:flex; gap:10px; }

  .create-opt { display:flex; align-items:center; gap:14px; padding:16px; margin-bottom:12px; cursor:pointer; }
  .create-opt .co-ic { font-size:24px; width:40px; text-align:center; }
  .create-opt .co-txt strong { display:block; font-size:0.94rem; }
  .create-opt .co-txt span { font-size:0.76rem; color:var(--text-dim); }
  .create-opt.disabled { opacity:0.45; cursor:not-allowed; }
  .badge-soon { font-size:0.6rem; font-weight:700; background:var(--surface-2); color:var(--text-dim); padding:2px 7px; border-radius:20px; margin-left:6px; }

  .permission-card { text-align:center; padding:24px 18px; }
  .permission-card .ico { font-size:32px; margin-bottom:12px; }
  .permission-card h3 { margin:0 0 8px; font-size:1.02rem; }
  .permission-card p { margin:0 0 18px; color:var(--text-dim); font-size:0.86rem; line-height:1.5; }
  .error-card { border-left:3px solid var(--danger); text-align:left; }
  .error-card h3 { color:var(--danger); font-size:0.94rem; margin:0 0 6px; }
  .error-card p { margin:0 0 14px; color:var(--text-dim); font-size:0.84rem; line-height:1.5; }

  .rec-status { text-align:center; color:var(--text-dim); font-size:0.85rem; margin-top:4px; }
  .rec-timer { text-align:center; font-variant-numeric:tabular-nums; font-size:1.35rem; font-weight:700; margin:6px 0 12px; }
  #recWave { width:100%; height:84px; display:block; background:var(--surface); border-radius:14px; }
  #levelBarRec { width:100%; height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden; margin-top:10px; }
  #levelFillRec { height:100%; width:0%; background:var(--accent); }
  .rec-controls { display:flex; align-items:center; justify-content:center; gap:20px; margin-top:20px; }
  .rec-round { width:70px; height:70px; border-radius:50%; border:none; background:var(--danger); color:#fff; font-size:24px; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 4px 18px rgba(255,93,107,0.4); }
  .rec-small { width:50px; height:50px; border-radius:50%; border:none; background:var(--surface-2); color:var(--text); font-size:17px; display:flex; align-items:center; justify-content:center; cursor:pointer; }

  .proc-wrap { padding:26px 10px; }
  .proc-step { display:flex; align-items:center; gap:12px; padding:11px 4px; color:var(--text-dim); font-size:0.9rem; }
  .proc-step.active { color:var(--text); font-weight:700; }
  .proc-step .dot { width:20px; height:20px; border-radius:50%; border:2px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; }
  .proc-step.done .dot { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .proc-step.active .dot { border-color:var(--accent); }

  .name-input-inline { background:transparent; border:none; font-size:1.02rem; font-weight:700; width:100%; }
  .badge-orig { font-size:0.62rem; font-weight:700; color:var(--accent); border:1px solid var(--accent); border-radius:20px; padding:2px 8px; margin-left:6px; }
  .tabs { display:flex; background:var(--surface-2); border-radius:12px; padding:3px; margin:10px 0 12px; }
  .tabs button { flex:1; border:none; background:transparent; padding:8px; border-radius:9px; font-size:0.78rem; font-weight:700; color:var(--text-dim); cursor:pointer; }
  .tabs button.active { background:var(--surface); color:var(--text); }
  #rollCanvas { width:100%; height:170px; display:block; background:var(--bg-2); border-radius:14px; border:1px solid var(--border); }
  .preview-banner { background:var(--surface-2); border:1px dashed var(--accent); border-radius:10px; padding:8px 12px; font-size:0.76rem; color:var(--accent); text-align:center; margin-bottom:8px; }
  .scrub-wrap { padding:8px 2px 2px; }
  #scrubBar { width:100%; height:20px; }
  .transport { display:flex; align-items:center; justify-content:center; gap:16px; margin:10px 0 4px; }
  .transport button { width:50px; height:50px; border-radius:50%; border:none; background:var(--surface-2); color:var(--text); font-size:18px; cursor:pointer; }
  .transport .play-btn { width:60px; height:60px; background:var(--accent); color:var(--accent-ink); font-size:21px; }

  .note-edit-bar { display:none; flex-wrap:wrap; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px; margin-top:10px; }
  .note-edit-bar.show { display:flex; }
  .ne-title { width:100%; font-size:0.76rem; color:var(--text-dim); margin-bottom:2px; }
  .ne-btn { flex:1; min-width:62px; background:var(--surface-2); border:none; border-radius:10px; padding:9px 4px; font-size:0.7rem; font-weight:700; color:var(--text); cursor:pointer; }
  .ne-btn.danger { color:var(--danger); }
  .editor-toolbar { display:flex; gap:8px; margin-top:12px; }
  .editor-toolbar button { flex:1; }

  .instr-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:4px; }
  .instr-card { position:relative; display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:10px 12px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,0.12); }
  .instr-card .ic-badge { width:38px; height:38px; border-radius:11px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0; }
  .instr-card .lb { font-size:0.82rem; font-weight:700; color:var(--text); text-align:left; }
  .instr-card.sel { border-color:var(--accent); box-shadow:0 4px 16px var(--glow); }
  .instr-card.sel .ic-badge { background:linear-gradient(155deg, var(--accent), var(--accent-strong)); color:var(--accent-ink); }
  .instr-card.sel .lb { color:var(--accent); }
  .instr-card .check { position:absolute; top:6px; right:8px; color:var(--accent); font-size:13px; opacity:0; }
  .instr-card.sel .check { opacity:1; }

  .tempo-row { display:flex; gap:8px; margin-top:4px; }
  .tempo-chip { flex:1; background:var(--surface-2); border:1px solid transparent; border-radius:10px; padding:9px 4px; text-align:center; font-size:0.76rem; font-weight:700; color:var(--text-dim); cursor:pointer; }
  .tempo-chip.sel { border-color:var(--accent); color:var(--accent); background:rgba(53,224,122,0.1); }

  .search-box { display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-bottom:12px; }
  .search-box input { flex:1; background:transparent; border:none; outline:none; font-size:0.86rem; }
  .filter-row { display:flex; gap:8px; margin-bottom:14px; overflow-x:auto; }
  .chip { background:var(--surface-2); border:1px solid transparent; border-radius:20px; padding:7px 13px; font-size:0.76rem; font-weight:700; color:var(--text-dim); cursor:pointer; white-space:nowrap; }
  .chip.sel { border-color:var(--accent); color:var(--accent); }

  .lib-card { display:flex; align-items:center; gap:12px; padding:12px; margin-bottom:10px; cursor:pointer; }
  .lib-card canvas { width:58px; height:32px; background:var(--surface-2); border-radius:8px; flex-shrink:0; }
  .lib-info { flex:1; min-width:0; }
  .li-name { font-weight:700; font-size:0.88rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:6px; }
  .li-meta { font-size:0.7rem; color:var(--text-dim); }
  .draft-dot { width:6px; height:6px; border-radius:50%; background:var(--warn); flex-shrink:0; }
  .lib-actions { display:flex; gap:4px; }
  .icon-btn { width:32px; height:32px; border-radius:9px; border:none; background:var(--surface-2); color:var(--text-dim); font-size:14px; cursor:pointer; }
  .icon-btn.on { color:var(--accent); }

  .settings-group { margin-bottom:20px; }
  .settings-group h4 { font-size:0.74rem; color:var(--text-dim); margin:0 0 8px 2px; font-weight:700; }
  .set-row { display:flex; align-items:center; justify-content:space-between; padding:13px 14px; background:var(--surface); border:1px solid var(--border); border-top:none; }
  .set-row:first-child { border-radius:14px 14px 0 0; border-top:1px solid var(--border); }
  .set-row:last-child { border-radius:0 0 14px 14px; }
  .set-row:only-child { border-radius:14px; }
  .set-label { font-size:0.84rem; }
  .seg { display:flex; background:var(--surface-2); border-radius:9px; padding:2px; }
  .seg button { border:none; background:transparent; padding:5px 10px; font-size:0.7rem; font-weight:700; color:var(--text-dim); border-radius:7px; cursor:pointer; }
  .seg button.sel { background:var(--surface); color:var(--accent); }
  .switch { width:42px; height:24px; border-radius:20px; background:var(--surface-2); position:relative; border:none; cursor:pointer; flex-shrink:0; }
  .switch.on { background:var(--accent); }
  .switch .knob { position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform 0.15s; }
  .switch.on .knob { transform:translateX(18px); }
  input[type="range"] { width:100%; accent-color:var(--accent); }

  .help-item, .cert-card { padding:14px; margin-bottom:10px; }
  .help-item h4 { margin:0 0 6px; font-size:0.87rem; }
  .help-item p, .priv-text p { margin:0; color:var(--text-dim); font-size:0.82rem; line-height:1.55; }
  .priv-text p { margin-bottom:12px; }

  .cert-card { border:1px solid var(--accent); position:relative; overflow:hidden; }
  .cert-card::before { content:''; position:absolute; top:-40px; right:-40px; width:120px; height:120px; background:radial-gradient(circle, var(--glow), transparent 70%); }
  .cert-title { font-weight:800; font-size:1.05rem; margin-bottom:2px; }
  .cert-sub { font-size:0.72rem; color:var(--text-dim); margin-bottom:14px; }
  .cert-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:0.8rem; gap:10px; }
  .cert-row span:first-child { color:var(--text-dim); flex-shrink:0; }
  .cert-row span:last-child { text-align:right; word-break:break-all; font-variant-numeric:tabular-nums; }
  .cert-disclaimer { margin-top:14px; font-size:0.7rem; color:var(--text-dim); line-height:1.5; }

  #bottom-nav { display:flex; align-items:flex-end; justify-content:space-around; padding:8px 6px max(10px, env(safe-area-inset-bottom)); background:var(--bg-2); border-top:1px solid var(--border); }
  .nav-item { background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text-dim); font-size:0.58rem; font-weight:700; padding:4px 4px; cursor:pointer; flex:1; }
  .nav-item .ni-ic { font-size:18px; }
  .nav-item.sel { color:var(--accent); }
  .nav-item.center { flex:0 0 auto; margin-top:-20px; }
  .nav-item.center .ni-ic { width:46px; height:46px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-size:21px; box-shadow:0 6px 18px var(--glow); }

  #modal-root, #sheet-root { position:fixed; inset:0; z-index:50; display:none; }
  #modal-root.show, #sheet-root.show { display:block; }
  .overlay-bg { position:absolute; inset:0; background:rgba(0,0,0,0.55); }
  .modal-box { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(340px, calc(100% - 40px)); max-height:80vh; overflow-y:auto; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:20px; }
  .modal-box h3 { margin:0 0 8px; font-size:1rem; }
  .modal-box p { margin:0 0 14px; color:var(--text-dim); font-size:0.84rem; line-height:1.5; }
  .modal-box input[type=text] { width:100%; padding:11px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:0.9rem; margin-bottom:14px; }
  .modal-box textarea { width:100%; height:130px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:0.7rem; padding:10px; margin-bottom:14px; resize:none; }
  .sheet-box { position:absolute; left:0; right:0; bottom:0; background:var(--surface); border-radius:20px 20px 0 0; padding:10px 8px max(16px, env(safe-area-inset-bottom)); max-width:480px; margin:0 auto; max-height:75vh; overflow-y:auto; }
  .sheet-handle { width:36px; height:4px; background:var(--border); border-radius:3px; margin:6px auto 10px; }
  .sheet-item { display:flex; align-items:center; gap:12px; padding:13px 14px; font-size:0.88rem; cursor:pointer; border-radius:10px; }
  .sheet-item:active { background:var(--surface-2); }
  .sheet-item.danger { color:var(--danger); }

  #toast-root { position:fixed; left:50%; bottom:88px; transform:translateX(-50%); z-index:60; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
  .toast { background:var(--surface); border:1px solid var(--border); color:var(--text); padding:10px 18px; border-radius:24px; font-size:0.8rem; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,0.3); opacity:0; transform:translateY(8px); transition:all 0.2s; }
  .toast.show { opacity:1; transform:translateY(0); }

  #onboarding { position:fixed; inset:0; background:var(--bg); z-index:100; display:flex; flex-direction:column; max-width:480px; margin:0 auto; }
  .onb-skip { align-self:flex-end; padding:16px 20px; background:none; border:none; color:var(--text-dim); font-size:0.85rem; font-weight:700; cursor:pointer; }
  .onb-body { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px 30px; }
  .onb-body .ico { font-size:52px; margin-bottom:20px; }
  .onb-body h2 { font-size:1.35rem; margin:0 0 10px; font-weight:800; }
  .onb-body p { color:var(--text-dim); font-size:0.9rem; margin:0; }
  .onb-dots { display:flex; gap:6px; justify-content:center; padding-bottom:18px; }
  .onb-dots span { width:7px; height:7px; border-radius:50%; background:var(--border); }
  .onb-dots span.on { background:var(--accent); width:20px; border-radius:4px; }
  .onb-footer { padding:0 24px max(24px, env(safe-area-inset-bottom)); }

  [hidden] { display:none !important; }
</style>
</head>
<body>
<div id="app">
  <main id="screen-root"></main>
  <nav id="bottom-nav"></nav>
</div>
<div id="modal-root"><div class="overlay-bg" data-action="modal:cancel"></div><div class="modal-box" id="modal-content"></div></div>
<div id="sheet-root"><div class="overlay-bg" data-action="sheet:close"></div><div class="sheet-box" id="sheet-content"></div></div>
<div id="toast-root"></div>
<div id="onboarding" hidden></div>

<script>
(function(){
"use strict";

/* =====================================================================
   PRESERVED AUDIO ENGINE
   Everything in this block is carried over unchanged from the published
   v0.1 HumTune Artifact: the same autocorrelation pitch detector, median
   smoothing, note segmentation, note-math and environment/permission
   checks. This is the real, working microphone -> pitch -> notes
   pipeline, not rebuilt or replaced.
===================================================================== */
const MAX_RECORD_SECONDS = 20; // was 12 in v0.1; raised so a full short tune fits
const SAMPLE_INTERVAL_MS = 45;
const MIN_FREQ = 70;
const MAX_FREQ = 1100;
const SILENCE_RMS = 0.012;

function freqToMidi(freq) { return 69 + 12 * Math.log2(freq / 440); }
function midiToFreq(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }
const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
function midiToName(midi) {
  const m = Math.round(midi);
  const name = NOTE_NAMES[((m % 12) + 12) % 12];
  const octave = Math.floor(m / 12) - 1;
  return name + octave;
}

const CLARITY_THRESHOLD = 0.38; // minimum normalized autocorrelation peak to trust a pitch estimate at all

function detectPitch(buf, sampleRate, noiseFloor) {
  const SIZE = buf.length;
  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  const effectiveGate = Math.max(SILENCE_RMS * 0.5, (noiseFloor || SILENCE_RMS) * 2.2);
  if (rms < effectiveGate) return { freq: -1, rms, clarity: 0 };

  let start = 0, end = SIZE - 1;
  const trimThresh = 0.2;
  while (start < SIZE / 2 && Math.abs(buf[start]) < trimThresh) start++;
  while (end > SIZE / 2 && Math.abs(buf[end]) < trimThresh) end--;
  const trimmed = buf.subarray(start, end);
  const n = trimmed.length;
  if (n < 512) return { freq: -1, rms, clarity: 0 };

  // Only compute correlation for lags inside the plausible pitch range —
  // correctness (can't pick an implausible peak) and performance (far fewer
  // lags than scanning the whole buffer) at the same time.
  const minLag = Math.max(2, Math.floor(sampleRate / MAX_FREQ));
  const maxLag = Math.min(n - 2, Math.ceil(sampleRate / MIN_FREQ));
  if (maxLag <= minLag) return { freq: -1, rms, clarity: 0 };

  let energy0 = 0;
  for (let i = 0; i < n; i++) energy0 += trimmed[i] * trimmed[i];
  if (energy0 <= 0) return { freq: -1, rms, clarity: 0 };

  const c = new Float32Array(maxLag + 2);
  for (let lag = minLag; lag <= maxLag + 1 && lag < n; lag++) {
    let sum = 0;
    for (let i = 0; i < n - lag; i++) sum += trimmed[i] * trimmed[i + lag];
    c[lag] = sum;
  }
  let maxVal = -Infinity, maxPos = -1;
  for (let lag = minLag; lag <= maxLag; lag++) if (c[lag] > maxVal) { maxVal = c[lag]; maxPos = lag; }
  if (maxPos < 0) return { freq: -1, rms, clarity: 0 };

  // Subharmonic/octave guard: if doubling the lag (halving the frequency)
  // is nearly as strong, that's the signature of an octave-doubling error —
  // prefer the lower-frequency candidate.
  const doubledLag = maxPos * 2;
  if (doubledLag <= maxLag && c[doubledLag] >= 0.85 * maxVal) {
    maxPos = doubledLag; maxVal = c[doubledLag];
  }

  const clarity = maxVal / energy0;
  if (clarity < CLARITY_THRESHOLD) return { freq: -1, rms, clarity };

  const x1 = c[maxPos - 1] || 0, x2 = c[maxPos], x3 = c[maxPos + 1] || 0;
  const a = (x1 + x3 - 2 * x2) / 2, b = (x3 - x1) / 2;
  let refinedLag = maxPos;
  if (a !== 0) refinedLag = maxPos - b / (2 * a);
  const freq = sampleRate / refinedLag;
  if (freq < MIN_FREQ || freq > MAX_FREQ || !isFinite(freq)) return { freq: -1, rms, clarity };
  return { freq, rms, clarity };
}

function medianSmooth(values, windowSize) {
  const half = Math.floor(windowSize / 2);
  const out = new Array(values.length).fill(null);
  for (let i = 0; i < values.length; i++) {
    if (values[i] == null) { out[i] = null; continue; }
    const win = [];
    for (let j = i - half; j <= i + half; j++) if (j >= 0 && j < values.length && values[j] != null) win.push(values[j]);
    win.sort((a, b) => a - b);
    out[i] = win[Math.floor(win.length / 2)];
  }
  return out;
}

function correctOctaveJumps(frames) {
  // Conservative, causal (backward-looking only) octave-error correction.
  // Only fires when a frame's pitch sits within OCTAVE_TOL semitones of
  // exactly +/-12 from the recent confident local median — the signature of
  // an isolated octave-doubling artifact, not a real melodic jump (a real
  // sustained octave change persists across many frames and simply becomes
  // the new local median, so it's never "corrected" away).
  const CONTEXT_WINDOW = 6, OCTAVE_TOL = 0.6;
  const out = frames.map(f => Object.assign({}, f));
  for (let i = 0; i < out.length; i++) {
    if (out[i].midi == null) continue;
    const contextVals = [];
    for (let j = i - 1; j >= 0 && contextVals.length < CONTEXT_WINDOW; j--) {
      if (out[j].midi != null) contextVals.push(out[j].midi);
    }
    if (contextVals.length < 2) continue;
    contextVals.sort((a, b) => a - b);
    const localMedian = contextVals[Math.floor(contextVals.length / 2)];
    const diff = out[i].midi - localMedian;
    if (Math.abs(Math.abs(diff) - 12) <= OCTAVE_TOL) out[i].midi -= Math.sign(diff) * 12;
  }
  return out;
}

function extractNotes(smoothedFrames, minDuration) {
  const segments = [];
  let cur = null;
  for (let i = 0; i < smoothedFrames.length; i++) {
    const f = smoothedFrames[i];
    if (f.midi == null) { if (cur) { segments.push(cur); cur = null; } continue; }
    const rounded = Math.round(f.midi);
    const clarity = f.clarity || 0;
    if (!cur) cur = { midi: rounded, start: f.t, end: f.t, sum: f.midi, count: 1, claritySum: clarity };
    else if (rounded === cur.midi) { cur.end = f.t; cur.sum += f.midi; cur.count++; cur.claritySum += clarity; }
    else { segments.push(cur); cur = { midi: rounded, start: f.t, end: f.t, sum: f.midi, count: 1, claritySum: clarity }; }
  }
  if (cur) segments.push(cur);

  let result = segments.filter(s => (s.end - s.start) >= minDuration).map(s => {
    const avgMidi = s.sum / s.count;
    const confidence = Math.max(0, Math.min(1, (s.claritySum / s.count) / 0.7));
    return { midi: Math.round(avgMidi), freq: midiToFreq(avgMidi), name: midiToName(avgMidi), start: s.start, end: s.end, confidence, frameCount: s.count };
  });

  const merged = [];
  for (const n of result) {
    const last = merged[merged.length - 1];
    if (last && last.midi === n.midi && (n.start - last.end) < 0.09) {
      const totalFrames = last.frameCount + n.frameCount;
      last.confidence = (last.confidence * last.frameCount + n.confidence * n.frameCount) / totalFrames;
      last.frameCount = totalFrames; last.end = n.end;
    } else merged.push(Object.assign({}, n));
  }
  return merged.map(n => ({ midi: n.midi, freq: n.freq, name: n.name, start: n.start, end: n.end, confidence: Math.round(n.confidence * 100) / 100 }));
}

function checkEnvironment() {
  if (!window.isSecureContext) return "This page isn't loaded over a secure (https) connection, so the browser won't allow microphone access here. Open HumTune's published link directly in your phone's browser to get an https address.";
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return "This browser doesn't expose the microphone API (getUserMedia). Try the latest Chrome, Safari, or Firefox.";
  if (!(window.AudioContext || window.webkitAudioContext)) return "This browser doesn't support the Web Audio API needed to analyze pitch.";
  return null;
}

/* new diagnostic layer built ON TOP of the same frame data, for the
   more specific error states the brief asks for (too-short / silent /
   noisy) — does not change how pitch is detected */
function diagnoseRecording(frames) {
  if (frames.length < 6) return 'too_short';
  const sound = frames.filter(f => f.rms >= SILENCE_RMS);
  if (sound.length === 0) return 'silent';
  const pitched = sound.filter(f => f.midi != null);
  if (pitched.length / sound.length < 0.25) return 'noisy';
  return null;
}

/* =====================================================================
   AudioRecorder — same getUserMedia/permission flow as v0.1, extended
   with pause/resume (the brief asked for this "if technically
   possible" — it is, since we just stop appending samples) and a
   pluggable sensitivity/noise-suppression setting from Settings.
===================================================================== */
const Recorder = {
  stream: null, ctx: null, source: null, gainNode: null, analyser: null,
  recordStartCtxTime: 0, pausedElapsed: 0, paused: false, _pauseStartedAt: 0,
  noiseFloor: 0.006,

  async start(settings) {
    const envErr = checkEnvironment();
    if (envErr) return { error: { title: "Can't access audio here", message: envErr } };
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: !!settings.noiseSuppression, autoGainControl: false }
      });
    } catch (err) {
      if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError')
        return { error: { title: 'Microphone permission denied', message: "HumTune needs microphone access to hear your humming. Allow microphone access for this site in your browser settings, then reload and try again." } };
      if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError')
        return { error: { title: 'No microphone found', message: "Your device doesn't seem to have a microphone available to the browser." } };
      if (err.name === 'NotReadableError')
        return { error: { title: 'Microphone is busy', message: 'Another app may be using the microphone right now. Close it and try again.' } };
      return { error: { title: 'Microphone error', message: err.message || 'An unknown error occurred while accessing the microphone.' } };
    }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') await this.ctx.resume();
      this.source = this.ctx.createMediaStreamSource(this.stream);
      this.gainNode = this.ctx.createGain();
      this.gainNode.gain.value = settings.sensitivity || 1;
      this.analyser = this.ctx.createAnalyser();
      this.analyser.fftSize = 2048;
      this.source.connect(this.gainNode).connect(this.analyser);
    } catch (err) {
      this.releaseStream();
      return { error: { title: 'Audio setup failed', message: err.message || 'Could not initialize the audio pipeline.' } };
    }
    this.recordStartCtxTime = this.ctx.currentTime;
    this.pausedElapsed = 0;
    this.paused = false;
    this.noiseFloor = 0.006;
    return { ok: true };
  },

  sampleOnce() {
    if (!this.analyser || this.paused) return null;
    const buf = new Float32Array(this.analyser.fftSize);
    this.analyser.getFloatTimeDomainData(buf);
    const { freq, rms, clarity } = detectPitch(buf, this.ctx.sampleRate, this.noiseFloor);
    // Slowly track the ambient noise floor from quiet moments only, so a
    // sustained loud hum can never drag the "floor" up and make the gate
    // too permissive — only readings near-or-below the current estimate move it.
    if (rms < this.noiseFloor * 3) this.noiseFloor = this.noiseFloor * 0.9 + rms * 0.1;
    const t = (this.ctx.currentTime - this.recordStartCtxTime - this.pausedElapsed);
    const midi = freq > 0 ? freqToMidi(freq) : null;
    return { t, midi, rms, clarity };
  },

  pause() { if (!this.paused) { this._pauseStartedAt = this.ctx.currentTime; this.paused = true; } },
  resume() { if (this.paused) { this.pausedElapsed += this.ctx.currentTime - this._pauseStartedAt; this.paused = false; } },

  releaseStream() {
    if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; }
    if (this.source) { try { this.source.disconnect(); } catch (e) {} this.source = null; }
    if (this.ctx) { try { this.ctx.close(); } catch (e) {} this.ctx = null; }
    this.analyser = null; this.gainNode = null;
  }
};

/* =====================================================================
   MelodyModel — Note shape adapted for editing (id + pitch + velocity)
   built from the exact notes extractNotes() returns. The original
   engine doesn't estimate per-note loudness, so velocity defaults to a
   flat 0.8 today rather than inventing dynamics data that was never
   detected.
===================================================================== */
function newId(prefix) { return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function toAppNotes(rawNotes) { return rawNotes.map(n => ({ id: newId('n'), pitch: n.midi, start: n.start, end: n.end, velocity: 0.8, confidence: (n.confidence != null ? n.confidence : 1) })); }

/* =====================================================================
   MUSICAL ENHANCEMENT ENGINE (local, rule-based — not an external AI model)
   Suggests conservative pitch/cleanup fixes based on the melody's own
   detected key and each note's own confidence — never touches a note the
   detector was already confident about, so the user's real musical intent
   (including "unusual" but deliberate notes) is preserved.
===================================================================== */
const KRUMHANSL_MAJOR = [6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88];
const KRUMHANSL_MINOR = [6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];
const MAJOR_SCALE = [0,2,4,5,7,9,11], MINOR_SCALE = [0,2,3,5,7,8,10];

function detectSuggestedKey(notes) {
  if (!notes.length) return null;
  const weights = new Array(12).fill(0);
  notes.forEach(n => { weights[((n.pitch % 12) + 12) % 12] += Math.max(0.1, n.end - n.start); });
  function correlate(profile, rotation) {
    const rotated = profile.map((_, i) => profile[(i - rotation + 12) % 12]);
    const meanW = weights.reduce((a,b)=>a+b,0) / 12, meanP = rotated.reduce((a,b)=>a+b,0) / 12;
    let num = 0, dw = 0, dp = 0;
    for (let i = 0; i < 12; i++) { const w = weights[i]-meanW, p = rotated[i]-meanP; num += w*p; dw += w*w; dp += p*p; }
    return (dw && dp) ? num / Math.sqrt(dw*dp) : 0;
  }
  let best = { tonic: 0, mode: 'major', score: -Infinity };
  for (let t = 0; t < 12; t++) {
    const majScore = correlate(KRUMHANSL_MAJOR, t), minScore = correlate(KRUMHANSL_MINOR, t);
    if (majScore > best.score) best = { tonic: t, mode: 'major', score: majScore };
    if (minScore > best.score) best = { tonic: t, mode: 'minor', score: minScore };
  }
  return { tonic: best.tonic, mode: best.mode, name: NOTE_NAMES[best.tonic] + (best.mode === 'major' ? ' Major' : ' Minor') };
}

function enhanceMelody(notes, level) {
  const key = detectSuggestedKey(notes);
  if (!key) return { notes: notes, summary: [], key: null };
  const scale = (key.mode === 'major' ? MAJOR_SCALE : MINOR_SCALE).map(d => (d + key.tonic) % 12);
  const confThreshold = level === 'balanced' ? 0.75 : 0.5;
  const out = notes.map(n => Object.assign({}, n));
  const summary = [];
  out.forEach((n, i) => {
    const pc = ((n.pitch % 12) + 12) % 12;
    if (scale.includes(pc)) return; // already in key — never touched
    const conf = n.confidence != null ? n.confidence : 1;
    if (conf >= confThreshold) return; // detector was confident — respect it, don't override intent
    let bestShift = null, bestDist = Infinity;
    for (const shift of [-1, 1, -2, 2]) {
      const candidatePc = ((pc + shift) % 12 + 12) % 12;
      if (scale.includes(candidatePc) && Math.abs(shift) < bestDist) { bestDist = Math.abs(shift); bestShift = shift; }
    }
    if (bestShift != null) {
      const fromName = midiToName(n.pitch);
      n.pitch += bestShift;
      summary.push(`Note ${i+1}: ${fromName} → ${midiToName(n.pitch)} (matched to ${key.name}, was a low-confidence detection)`);
    }
  });
  if (level === 'balanced') {
    const kept = [];
    out.forEach((n, i) => {
      const dur = n.end - n.start, conf = n.confidence != null ? n.confidence : 1;
      if (dur < 0.1 && conf < 0.4 && kept.length) { summary.push(`Removed a very short, low-confidence fragment near ${fmtTime(n.start)}`); return; }
      kept.push(n);
    });
    return { notes: kept, summary, key };
  }
  return { notes: out, summary, key };
}

const MelodyModel = {
  fromDetected(rawNotes, settings) {
    const notes = toAppNotes(rawNotes);
    return {
      id: null, name: '', notes,
      originalNotes: JSON.parse(JSON.stringify(notes)), // immutable snapshot, never edited
      versions: [], // snapshots pushed on each Save-after-edit
      tempo: (settings && settings.tempo) || 100,
      instrument: (settings && settings.instrument) || 'piano',
      createdAt: Date.now(), updatedAt: Date.now(),
      favorite: false, draft: true, version: 1
    };
  },
  blank(settings) {
    return { id: null, name: '', notes: [], originalNotes: [], versions: [], tempo: (settings&&settings.tempo)||100, instrument: (settings&&settings.instrument)||'piano', createdAt: Date.now(), updatedAt: Date.now(), favorite: false, draft: true, version: 1 };
  },
  clone(m) { return JSON.parse(JSON.stringify(m)); },
  duration(m) { if (!m.notes.length) return 0; return Math.max(...m.notes.map(n => n.end)); },
  isEqual(a, b) { return JSON.stringify({n:a.notes,t:a.tempo,i:a.instrument,name:a.name}) === JSON.stringify({n:b.notes,t:b.tempo,i:b.instrument,name:b.name}); }
};

/* =====================================================================
   STORAGE — localStorage (the melody+settings payloads here are small
   text/JSON, well within what localStorage is meant for; IndexedDB
   would only earn its complexity at a much larger data scale)
===================================================================== */
const Storage = {
  K: { melodies:'humtune_melodies_v1', deleted:'humtune_deleted_v1', draft:'humtune_draft_v1', settings:'humtune_settings_v1', onboarded:'humtune_onboarded_v1' },
  loadMelodies() { try { return JSON.parse(localStorage.getItem(this.K.melodies)) || []; } catch (e) { return []; } },
  saveMelodies(l) { try { localStorage.setItem(this.K.melodies, JSON.stringify(l)); } catch (e) { toast('Storage failed — your browser may be out of space or blocking local storage.'); } },
  upsertMelody(m) { const l = this.loadMelodies(); const i = l.findIndex(x=>x.id===m.id); if (i>=0) l[i]=m; else l.unshift(m); this.saveMelodies(l); return m; },
  getMelody(id) { return this.loadMelodies().find(x=>x.id===id) || null; },
  softDeleteMelody(id) {
    const l = this.loadMelodies(); const idx = l.findIndex(x=>x.id===id); if (idx<0) return;
    const [m] = l.splice(idx,1); this.saveMelodies(l);
    const del = this.loadDeleted(); m._deletedAt = Date.now(); del.unshift(m);
    try { localStorage.setItem(this.K.deleted, JSON.stringify(del.slice(0,50))); } catch(e){}
  },
  loadDeleted() { try { return JSON.parse(localStorage.getItem(this.K.deleted)) || []; } catch(e){ return []; } },
  restoreDeleted(id) {
    const del = this.loadDeleted(); const idx = del.findIndex(x=>x.id===id); if (idx<0) return;
    const [m] = del.splice(idx,1); delete m._deletedAt;
    try { localStorage.setItem(this.K.deleted, JSON.stringify(del)); } catch(e){}
    this.upsertMelody(m);
  },
  purgeDeletedForever(id) { const del = this.loadDeleted().filter(x=>x.id!==id); try { localStorage.setItem(this.K.deleted, JSON.stringify(del)); } catch(e){} },
  loadDraft() { try { return JSON.parse(localStorage.getItem(this.K.draft)); } catch (e) { return null; } },
  saveDraft(m) { try { localStorage.setItem(this.K.draft, JSON.stringify(m)); } catch (e) {} },
  clearDraft() { localStorage.removeItem(this.K.draft); },
  loadSettings() {
    const d = { theme:'dark', instrument:'piano', tempo:100, noiseSuppression:true, sensitivity:1, textSize:'md', motion:'system' };
    try { return Object.assign(d, JSON.parse(localStorage.getItem(this.K.settings)) || {}); } catch (e) { return d; }
  },
  saveSettings(s) { try { localStorage.setItem(this.K.settings, JSON.stringify(s)); } catch (e) {} },
  isOnboarded() { return localStorage.getItem(this.K.onboarded) === '1'; },
  setOnboarded() { localStorage.setItem(this.K.onboarded, '1'); }
};

   INSTRUMENT ENGINE — procedurally synthesized voices (Web Audio
   oscillators). HumTune doesn't ship or load sampled instrument
   recordings, so each "instrument" is a distinct synthesized
   approximation, not a realistic sample.
===================================================================== */
const INSTRUMENTS = {

                 transient:{ freq:3200, q:0.8, gain:0.06, duration:0.02, filterType:'bandpass' } },

                 transient:{ freq:4200, q:1.2, gain:0.14, duration:0.012, filterType:'bandpass' } },

                 transient:{ freq:3600, q:1.0, gain:0.1, duration:0.01, filterType:'bandpass' } },
  violin:      { label:'Violin', icon:'🎻', osc1:'sawtooth', osc2:'sawtooth', ratio:1.005, gain2:0.45, ff:2400, fq:1.2, atk:0.11, rel:0.28, vib:5.5, vd:6, oct:0, sustain:true, decay:0.14, sustainLevel:0.72 },
  flute:       { label:'Flute', icon:'🪈', osc1:'sine', osc2:'sine', ratio:2, gain2:0.05, ff:4200, fq:0.5, atk:0.08, rel:0.22, vib:4.5, vd:4, oct:1, sustain:true, decay:0.1, sustainLevel:0.68,
                 transient:{ freq:2600, q:0.6, gain:0.05, duration:0.05, filterType:'bandpass' } },
  trumpet:     { label:'Trumpet', icon:'🎺', osc1:'sawtooth', osc2:'square', ratio:1, gain2:0.30, ff:2200, fq:2.0, atk:0.02, rel:0.16, vib:0, vd:0, oct:0, sustain:true, decay:0.06, sustainLevel:0.75 },
  saxophone:   { label:'Saxophone', icon:'🎷', osc1:'sawtooth', osc2:'square', ratio:1.003, gain2:0.35, ff:1900, fq:2.6, atk:0.045, rel:0.24, vib:4.8, vd:5, oct:0, sustain:true, decay:0.1, sustainLevel:0.7,
                 transient:{ freq:2200, q:0.7, gain:0.06, duration:0.045, filterType:'bandpass' } },
  bass:        { label:'Bass', icon:'🎸', osc1:'sine', osc2:'triangle', ratio:2, gain2:0.10, ff:900, fq:0.8, atk:0.01, rel:0.24, vib:0, vd:0, oct:-1, sustain:false },
  synth:       { label:'Synth', icon:'🎛️', osc1:'sawtooth', osc2:'square', ratio:1.5, gain2:0.25, ff:1800, fq:3.0, atk:0.005, rel:0.2, vib:0, vd:0, oct:0, sustain:false }
};
function freqCurve(base, dur, vibHz, vibDepth, pts) {

  const totalDur = Math.max(1, MelodyModel.duration(melody));
  const measureLen = 2;
  const notes = [];
  for (let t = 0; t < totalDur; t += measureLen) {
    notes.push({ id:newId('bn'), pitch: key.tonic+36, start:t, end:Math.min(t+measureLen-0.1, totalDur), velocity:0.8, confidence:1 });
  }

  const totalDur = Math.max(1, MelodyModel.duration(melody));

    this.nodes.forEach(n => { try { n.stop(this.ctx.currentTime); } catch(e){} });
    this.nodes = []; this.timers.forEach(id=>clearTimeout(id)); this.timers = [];
    if (this.raf) { cancelAnimationFrame(this.raf); this.raf = null; }
  },
  play(melody, fromSec, callbacks) {
    this.ensureCtx(); if (this.ctx.state==='suspended') this.ctx.resume();
    this.stopAllNodes(); this.melody = melody; this.callbacks = callbacks||{};
    const rate = melody.tempo/REF_TEMPO; const from = fromSec||0;
    this.positionSec = from; this.playStartCtxTime = this.ctx.currentTime+0.08; this.playing = true;
    const toPlay = melody.notes.filter(n=>n.end>from);
    toPlay.forEach(n => {
      const relStart = Math.max(0,(n.start-from)/rate); const dur = Math.max(0.05,(n.end-n.start)/rate);
      const startTime = this.playStartCtxTime + relStart;
      const voices = playInstrumentNote(this.ctx, melody.instrument, midiToFreq(n.pitch), startTime, dur, n.velocity, this.masterGain);
      this.nodes.push.apply(this.nodes, voices);
      const tid = setTimeout(()=>{ if (this.callbacks.onNote) this.callbacks.onNote(n.id); }, Math.max(0, relStart*1000));
      this.timers.push(tid);
    });
    const totalDur = (Math.max(from, melody.notes.length?Math.max(...melody.notes.map(n=>n.end)):from)-from)/rate;
    const endTid = setTimeout(()=>{ this.playing=false; if (this.callbacks.onEnd) this.callbacks.onEnd(); }, Math.max(0,totalDur*1000)+120);
    this.timers.push(endTid);
    const loop = () => { if (!this.playing) return; const elapsed=(this.ctx.currentTime-this.playStartCtxTime)*rate; this.positionSec = from+Math.max(0,elapsed); if (this.callbacks.onTick) this.callbacks.onTick(this.positionSec); this.raf = requestAnimationFrame(loop); };
    this.raf = requestAnimationFrame(loop);
  },
  pause() { if (!this.playing) return; this.playing=false; this.stopAllNodes(); },
  stop() { this.playing=false; this.positionSec=0; this.stopAllNodes(); },
  seek(sec) { const was=this.playing; this.stopAllNodes(); this.positionSec=sec; this.playing=false; if (was) this.play(this.melody, sec, this.callbacks); }
};

/* =====================================================================
   EXPORT — JSON export works today via the platform's downloads
   capability. A real Standard-MIDI-File byte encoder is implemented
   below for architectural readiness, but is not wired to a working
   download button: the downloads capability's file-type allowlist
   does not currently include .mid/.midi, so offering it would fail or
   mislead. See the final report for details.
===================================================================== */
function writeVarLen(v) { const b=[v&0x7f]; v>>=7; while (v>0) { b.unshift((v&0x7f)|0x80); v>>=7; } return b; }
function MidiExporter_toBytes(melody) {
  const division = 480;
  const usPerQuarter = Math.round(60000000/melody.tempo);
  const events = [{ tick:0, bytes:[0xFF,0x51,0x03,(usPerQuarter>>16)&0xff,(usPerQuarter>>8)&0xff,usPerQuarter&0xff] }];
  const ticksPerSec = division*melody.tempo/60;
  melody.notes.forEach(n => {
    events.push({ tick: Math.round(n.start*ticksPerSec), bytes:[0x90, n.pitch, Math.round(20+n.velocity*100)] });
    events.push({ tick: Math.round(n.end*ticksPerSec), bytes:[0x80, n.pitch, 0] });
  });
  events.sort((a,b)=>a.tick-b.tick);
  let trackBytes = [], lastTick = 0;
  events.forEach(e => { trackBytes.push.apply(trackBytes, writeVarLen(e.tick-lastTick)); trackBytes.push.apply(trackBytes, e.bytes); lastTick=e.tick; });
  trackBytes.push.apply(trackBytes, [0x00,0xFF,0x2F,0x00]);
  const len = trackBytes.length;
  const header = [0x4D,0x54,0x68,0x64,0,0,0,6,0,0,0,1,(division>>8)&0xff,division&0xff];
  const trackHeader = [0x4D,0x54,0x72,0x6B,(len>>>24)&0xff,(len>>>16)&0xff,(len>>>8)&0xff,len&0xff];
  return new Uint8Array(header.concat(trackHeader, trackBytes));
}
function melodyToJSON(m) { return JSON.stringify(m, null, 2); }
async function sha256Hex(str) {
  if (!(window.crypto && window.crypto.subtle)) return null;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function drawSparklines() {

function drawHeroWave() {
  const c = document.getElementById('heroWave'); if (!c) return;
  const dpr = window.devicePixelRatio||1; const w=c.clientWidth||300, h=80;

  const seeds = Array.from({length:bars},(_,i)=>0.3+0.7*Math.abs(Math.sin(i*12.9898)));

    ctx.clearRect(0,0,w,h);

      const phase = reduced?0:t/500+i*0.4;
      const amp = seeds[i]*(reduced?0.5:(0.35+0.65*Math.abs(Math.sin(phase))));
      const bh = 6+amp*(h*0.55); const x=(i/(bars-1))*(w-8)+4;

}

async function doStartRecording() {
  App.recState = { status:'permission' }; render();
  const res = await Recorder.start(App.settings);
  if (res.error) { App.recState = { status:'error', error: res.error }; render(); return; }
  App.recState = { status:'recording', frames: [] };
  // Take the first sample immediately, synchronously, before any DOM/render
  // work — this is what actually closes the recording-start gap, since the
  // analyser only ever exposes "the current window" and a delayed first
  // read permanently misses whatever audio has already scrolled past.
  const firstFrame = Recorder.sampleOnce();
  if (firstFrame) App.recState.frames.push(firstFrame);
  render();
  startRecLoop();
}
function startRecLoop() {
  let frames = App.recState.frames || (App.recState.frames = []);
  App.teardown = () => { clearInterval(recTimerInt); if (recRaf) cancelAnimationFrame(recRaf); Recorder.releaseStream(); };
  recTimerInt = setInterval(() => {
    const el = document.getElementById('recTimerEl'); if (el) el.textContent = fmtTime(Recorder.ctx ? (Recorder.ctx.currentTime - Recorder.recordStartCtxTime - Recorder.pausedElapsed) : 0);
    if (Recorder.ctx && !Recorder.paused && (Recorder.ctx.currentTime - Recorder.recordStartCtxTime) > MAX_RECORD_SECONDS) doStopRecording();
  }, 100);
  function loop() {
    const frame = Recorder.sampleOnce();
    if (frame) {
      frames.push(frame);
      const lf=document.getElementById('levelFillRec'); if (lf) lf.style.width = Math.min(100,frame.rms*1200)+'%';
      const noteEl = document.getElementById('liveNoteEl');
      if (noteEl) noteEl.textContent = frame.midi != null ? midiToName(frame.midi) : '\u00A0';
      const statusEl = document.getElementById('recStatusEl');
      if (statusEl && App.recState.status === 'recording') statusEl.textContent = frame.midi != null ? 'Keep humming…' : 'Listening…';
    }
    const canvas = document.getElementById('recWave');
    if (canvas && Recorder.analyser) {
      const dpr = window.devicePixelRatio||1; const w=canvas.clientWidth||300, h=84;
      canvas.width=w*dpr; canvas.height=h*dpr; const ctx=canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
      const buf = new Float32Array(Recorder.analyser.fftSize); Recorder.analyser.getFloatTimeDomainData(buf);
      const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
      ctx.strokeStyle = accent; ctx.lineWidth = 2; ctx.beginPath();

      for (let x=0;x<w;x++) { const v=buf[x*step]||0; const y=h/2+v*(h*0.42); x===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
      ctx.stroke();

function screenProcessing() {
  return `<div class="topbar"><div class="tb-title">Working on it</div></div>
  <div class="proc-wrap" id="procSteps">
    ${procStep('Listening','listen')}${procStep('Finding notes','find')}${procStep('Cleaning up','clean')}${procStep('Building your melody','build')}
  </div>`;
}
function procStep(label,key){ return `<div class="proc-step" data-step="${key}"><div class="dot"></div>${label}</div>`; }
let processingToken = 0;
function runProcessing(frames) {
  const myToken = ++processingToken;
  const steps = ['listen','find','clean','build']; let i=0;
  const setDone=(k)=>{ const el=document.querySelector(`.proc-step[data-step="${k}"]`); if (el){ el.classList.add('done'); el.classList.remove('active'); el.querySelector('.dot').textContent='✓'; } };
  const setActive=(k)=>{ const el=document.querySelector(`.proc-step[data-step="${k}"]`); if (el) el.classList.add('active'); };
  function next() {
    if (myToken !== processingToken) return; // a newer recording/processing run superseded this one
    if (i>0) setDone(steps[i-1]);
    if (i>=steps.length) { finishProcessing(frames, myToken); return; }
    setActive(steps[i]); i++; setTimeout(next, 380);
  }
  setTimeout(next, 120);
}
function applyOnsetLookback(notes, frames) {
  const MAX_LOOKBACK = 0.15;
  if (!notes.length || !frames.length) return notes;
  const out = []; let prevEnd = 0;
  for (const n of notes) {
    const idx = frames.findIndex(f => f.t >= n.start);
    let newStart = n.start;
    if (idx > 0) {
      for (let i = idx - 1; i >= 0 && (n.start - frames[i].t) <= MAX_LOOKBACK; i--) {
        if (frames[i].rms >= SILENCE_RMS && frames[i].t >= prevEnd) newStart = frames[i].t; else break;
      }
    }
    const note = newStart === n.start ? n : Object.assign({}, n, { start: newStart });
    out.push(note); prevEnd = note.end;
  }
  return out;
}

function finishProcessing(frames, myToken) {
  if (myToken !== undefined && myToken !== processingToken) return; // superseded — never let a stale result win
  const problem = diagnoseRecording(frames);
  if (problem==='too_short') return processingError('Your recording is too short', 'Hum at least a couple of seconds so HumTune has something to analyze.');
  if (problem==='silent') return processingError("We didn't hear anything", "Make sure your microphone isn't muted and try humming closer to it.");
  if (problem==='noisy') return processingError('Too much background noise', 'Try moving somewhere quieter and humming a clear, steady tone.');

function currentViewNotes() { return App.previewOriginal ? App.current.originalNotes : App.current.notes; }

function drawSheetMusic() {

function drawRoll() {
  const m = App.current; if (!m) return;
  const canvas = document.getElementById('rollCanvas'); if (!canvas) return;
  const dpr = window.devicePixelRatio||1; const cssW = canvas.clientWidth||300, cssH=170;
  canvas.width=cssW*dpr; canvas.height=cssH*dpr; const ctx=canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,cssW,cssH);
  const notes = currentViewNotes();
  const styles = getComputedStyle(document.documentElement);
  const accent = styles.getPropertyValue('--accent').trim(), keyLine = styles.getPropertyValue('--border').trim(), textDim = styles.getPropertyValue('--text-dim').trim();
  const padTop=10, padBottom=10, padLeft=App.editorView==='roll'?30:6, padRight=8;

    }

function drawScrub() {

  const dpr = window.devicePixelRatio||1; const w=canvas.clientWidth||300, h=20;
  canvas.width=w*dpr; canvas.height=h*dpr; const ctx=canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);

function drawEditorCanvas() { if (App.editorView === 'sheet') drawSheetMusic(); else drawRoll(); }
function handleRollClick(evt) {
  if (App.previewOriginal) return;
  const canvas = document.getElementById('rollCanvas'); if (!canvas || !canvas._layout) return;
  const rect = canvas.getBoundingClientRect(); const x=evt.clientX-rect.left, y=evt.clientY-rect.top;
  const L = canvas._layout;

  if (L.sheetMode) {
    if (!L.notes.length) return;
    const tapTime = ((x - L.padLeft) / L.plotW) * L.totalDur;
    let nearest = L.notes[0], bestDist = Infinity;
    for (const n of L.notes) { const d = Math.abs(n.start - tapTime); if (d < bestDist) { bestDist = d; nearest = n; } }
    App.selectedNoteId = nearest.id;
    drawEditorCanvas();
    const bar = document.getElementById('noteEditBar'); if (bar) bar.classList.toggle('show', true);
    syncPlayIcon();
    return;
  }

  let hit=null;
  for (const n of L.notes) {
    const nx=L.padLeft+(n.start/L.totalDur)*L.plotW, nw=Math.max(4,((n.end-n.start)/L.totalDur)*L.plotW), ny=L.padTop+L.plotH-((n.pitch-L.minMidi)/L.range)*L.plotH-6;

  }
  if (!hit && App.editorView === 'roll') {
    // Tap-to-add on empty space: derive time/pitch from the tap position.
    // Deliberately not drag-to-place — a single tap is reliable on mobile;
    // dragging on a small canvas is exactly the fragile interaction we're avoiding.
    const time = Math.max(0, ((x - L.padLeft) / L.plotW) * L.totalDur);
    const pitchFloat = L.minMidi + ((L.plotH - (y - L.padTop)) / L.plotH) * L.range;
    const pitch = Math.round(Math.max(36, Math.min(96, pitchFloat)));

    const id = newId('n');
    App.current.notes.push({ id, pitch, start: time, end: time + 0.3, velocity: 0.8, confidence: 1 });
    App.current.notes.sort((a,b)=>a.start-b.start);
    App.selectedNoteId = id;

    render();
    return;
  }

}
function handleScrubClick(evt) {
  const canvas = document.getElementById('scrubBar'); if (!canvas || !canvas._layout) return;
  const rect = canvas.getBoundingClientRect(); const x=evt.clientX-rect.left;
  const frac = Math.min(1,Math.max(0,x/canvas._layout.w)); const t = frac*canvas._layout.totalDur;

function noteAction(kind) {
  const m = App.current; const n = m.notes.find(x=>x.id===App.selectedNoteId); if (!n) return;
  pushUndo(); const minGap=0.08; const dur = n.end - n.start;
  const sorted = m.notes.slice().sort((a,b)=>a.start-b.start);
  const myIdx = sorted.findIndex(x=>x.id===n.id);
  const prev = sorted[myIdx-1], next = sorted[myIdx+1];

  if (kind==='lower') n.pitch = Math.max(36, n.pitch-1);

  App.previewOriginal = false; autosaveIfUnsaved(); closeModal(); toast('Original restored'); render();
}
function openVersionsSheet() {
  const m = App.current;
  const rows = m.versions.map((v,i) => `<div class="sheet-item" data-action="version:view" data-idx="${i}">🕒 Version ${i+1} · ${fmtDateTime(v.savedAt)}</div>`).join('');
  openSheet(`<div class="sheet-handle"></div><div class="sheet-item" data-action="version:view-original">📜 Original · ${fmtDateTime(m.createdAt)}</div>${rows}`);

function viewVersion(idx) {
  const m = App.current; const v = m.versions[idx]; if (!v) return;
  closeSheet();
  openModal(`<h3>Version ${idx+1}</h3><p>Saved ${esc(fmtDateTime(v.savedAt))} · ${v.notes.length} notes · ${v.tempo} BPM · ${INSTRUMENTS[v.instrument]?INSTRUMENTS[v.instrument].label:v.instrument}</p>

function restoreVersion(idx) {
  const m = App.current; const v = m.versions[idx]; if (!v) return;
  pushUndo(); m.notes = JSON.parse(JSON.stringify(v.notes)); m.tempo = v.tempo; m.instrument = v.instrument;
  autosaveIfUnsaved(); closeModal(); toast('Version restored'); render();
}

function openEnhanceReview() {
  const m = App.current;
  const result = enhanceMelody(m.notes, 'balanced');
  App._enhancePreview = result;
  const keyLine = result.key ? `Suggested key: <strong>${esc(result.key.name)}</strong>` : '';
  const summaryHtml = result.summary.length
    ? `<ul style="margin:0 0 14px;padding-left:18px;font-size:0.82rem;color:var(--text-dim);line-height:1.6">${result.summary.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`
    : `<p>Your melody already looks clean — no confident changes to suggest.</p>`;
  openModal(`
    <h3>✨ Make It Musical</h3>
    <p style="margin-bottom:4px">${keyLine}</p>
    ${summaryHtml}
    <p style="font-size:0.72rem;color:var(--text-dim);margin-bottom:14px">This only adjusts notes the detector was already unsure about and that fall outside the suggested key — it never overrides a note it was confident about, and your Original Melody is never touched.</p>
    <div class="btn-row" style="margin-bottom:8px">
      <button class="btn btn-secondary" style="flex:1" data-action="enhance:play-original">▶ Original</button>
      <button class="btn btn-secondary" style="flex:1" data-action="enhance:play-enhanced" ${result.summary.length?'':'disabled'}>▶ Enhanced</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" style="flex:1" data-action="enhance:discard">Discard</button>
      <button class="btn btn-primary" style="flex:1" data-action="enhance:keep" ${result.summary.length?'':'disabled'}>Keep Enhanced</button>
    </div>
  `, null);
}
function previewPlay(notes) {
  const m = App.current;
  Playback.play({ tempo: m.tempo, instrument: m.instrument, notes }, 0, { onTick:()=>{}, onEnd:()=>{} });
}
function keepEnhanced() {
  if (!App._enhancePreview) return;
  pushUndo();
  App.current.notes = App._enhancePreview.notes;
  App.current.notes.sort((a,b)=>a.start-b.start);
  autosaveIfUnsaved(); closeModal(); toast('Enhancement applied — Undo to revert'); render();
}

function saveMelody() {
  const m = App.current;
  const nameInput = document.getElementById('melodyNameInput'); if (nameInput) m.name = nameInput.value.trim();
  if (!m.id) {
    const doSave = (name) => {
      m.id = newId('m'); m.name = name || defaultMelodyName(); m.createdAt = Date.now(); m.updatedAt = Date.now(); m.draft = false;
      Storage.upsertMelody(m); Storage.clearDraft(); App.savedRef = MelodyModel.clone(m);
      closeModal(); toast('Melody saved'); render();
    };
    if (m.name) { doSave(m.name); return; }
    openModal(`<h3>Name your melody</h3><p>Give it a name you'll recognize later.</p>
      <input type="text" id="nameField" value="${esc(defaultMelodyName())}" />
      <div class="btn-row"><button class="btn btn-secondary" style="flex:1" data-action="modal:cancel">Cancel</button><button class="btn btn-primary" style="flex:1" data-action="modal:save-name">Save</button></div>`,
      null, { autofocus:'nameField' });
  } else {
    if (App.savedRef && !MelodyModel.isEqual(m, App.savedRef)) {
      m.versions = m.versions || [];
      m.versions.push({ notes: App.savedRef.notes, tempo: App.savedRef.tempo, instrument: App.savedRef.instrument, savedAt: App.savedRef.updatedAt || m.updatedAt });
    }
    m.updatedAt = Date.now(); m.draft = false; m.version = (m.version||1) + 1;
    Storage.upsertMelody(m); App.savedRef = MelodyModel.clone(m);
    toast('Saved'); render();
  }
}
function defaultMelodyName(){ const n = Storage.loadMelodies().length+1; return 'My Melody '+String(n).padStart(2,'0'); }

  const items = [
    ['How does HumTune work?', "You hum into your phone's microphone. HumTune measures the pitch of your voice over time, smooths out natural wobble, and groups the sound into distinct notes — then plays those notes back on a synthesized instrument."],
    ['What is Pitch?', "Pitch is how high or low a sound is. HumTune estimates pitch many times per second using a technique called autocorrelation, which finds the repeating pattern in your voice's sound wave."],
    ['Why can notes sometimes be wrong?', "Humming isn't as precise as playing an instrument — sliding between notes, vibrato, or background noise can occasionally cause a note to be split, merged, or off by a semitone."],

async function fillCertificate(m) {
  const canonical = JSON.stringify({ id:m.id, name:m.name, notes:m.notes, tempo:m.tempo, instrument:m.instrument, createdAt:m.createdAt, version:m.version });
  const hash = await sha256Hex(canonical);
  const el = document.getElementById('certBody'); if (!el) return;
  const recordId = hash ? ('CR-'+hash.slice(0,12).toUpperCase()) : 'unavailable';
  el.innerHTML = `
    <div class="cert-title">HumTune Creation Certificate</div>
    <div class="cert-sub">Technical creation record — not a legal registration</div>
    <div class="cert-row"><span>Melody Name</span><span>${esc(m.name)}</span></div>
    <div class="cert-row"><span>Melody ID</span><span>${esc(m.id)}</span></div>
    <div class="cert-row"><span>Creation Date</span><span>${esc(fmtDateTime(m.createdAt))}</span></div>
    <div class="cert-row"><span>Version</span><span>v${m.version||1}</span></div>
    <div class="cert-row"><span>Creation Record ID</span><span>${esc(recordId)}</span></div>
    <div class="cert-row"><span>Content Hash (SHA-256)</span><span>${hash?esc(hash):'Not available in this browser'}</span></div>
    <div class="cert-disclaimer">This is a technical creation record generated by HumTune. It is not a government copyright registration, patent, or legal determination of ownership. The hash above is a cryptographic fingerprint of this melody's saved data (notes, tempo, instrument) computed on your device — it proves the data hasn't changed since this record was generated, nothing more.</div>
  `;
}

async function getDownloads() { try { return window.claude ? await window.claude.use('downloads') : null; } catch(e){ return null; } }
function browserDownload(filename, data) {
  // Standard Web API download — no Claude dependency. This is what actually
  // fires once this same file is hosted independently (GitHub Pages, Netlify,
  // Cloudflare Pages, etc.), since window.claude won't exist there.
  try {
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  } catch (e) { return false; }
}
async function saveOrShowJSON(filename, data, title) {
  const dl = await getDownloads();
  if (dl) { try { await dl.save({ filename, data }); toast('Exported'); return; } catch(e) { /* fall through */ } }
  if (browserDownload(filename, data)) { toast('Downloaded'); return; }
  openModal(`<h3>${esc(title||'Export')}</h3><p>Direct download isn't available here — copy the JSON below instead.</p><textarea readonly>${esc(data)}</textarea><button class="btn btn-primary btn-block" data-action="modal:cancel">Done</button>`, null);
}
async function exportOwnershipPackage(id) {
  const m = Storage.getMelody(id); if (!m) return;
  const canonical = JSON.stringify({ id:m.id, name:m.name, notes:m.notes, tempo:m.tempo, instrument:m.instrument, createdAt:m.createdAt, version:m.version });
  const hash = await sha256Hex(canonical);
  const pkg = {
    certificate: { melodyName:m.name, melodyId:m.id, createdAt:m.createdAt, version:m.version, contentHashSHA256: hash, note:"Technical creation record generated by HumTune. Not a government copyright registration, patent, or legal determination of ownership." },
    originalMelody: { notes:m.originalNotes, tempo:m.tempo, instrument:m.instrument },
    currentMelody: { notes:m.notes, tempo:m.tempo, instrument:m.instrument },
    versionHistory: m.versions,
    metadata: { favorite:m.favorite, createdAt:m.createdAt, updatedAt:m.updatedAt },
    midiNote: "A binary .mid file could not be included: this environment's file-export allowlist does not currently support the .mid/.midi extension. All the data a MIDI file needs (pitch, startTime, duration, velocity, tempo) is present above and in currentMelody/originalMelody."
  };
  saveOrShowJSON((m.name||'melody').replace(/[^a-z0-9\- _]/gi,'').trim()+'-ownership-package.json', JSON.stringify(pkg,null,2), 'Ownership Package');
}

  if (action === 'editor:view-current') { viewCurrentFromOriginal(); return; }
  if (action === 'editor:restore-original') { restoreOriginal(); return; }
  if (action === 'editor:versions') { openVersionsSheet(); return; }
  if (action === 'editor:more') {
    const m = App.current;
    openSheet(`<div class="sheet-handle"></div>
      <div class="sheet-item" data-action="sheet:favorite">${m.favorite?'★ Remove from Favorites':'☆ Add to Favorites'}</div>
      <div class="sheet-item" data-action="sheet:rename">✎ Rename</div>
      <div class="sheet-item" data-action="sheet:duplicate">⧉ Duplicate</div>
      <div class="sheet-item" data-action="sheet:variation">🌱 Create Variation</div>
      <div class="sheet-item" data-action="sheet:protect">🛡 Protect My Melody</div>
      <div class="sheet-item" data-action="sheet:export">⇩ Export</div>
      <div class="sheet-item danger" data-action="sheet:delete">🗑 Delete</div>`);

  }

  if (action === 'version:view') { viewVersion(parseInt(idx,10)); return; }
  if (action === 'version:restore') { restoreVersion(parseInt(idx,10)); return; }

  if (action === 'library:open') { openMelodyById(id); return; }
  if (action === 'library:favorite') { const m=Storage.getMelody(id); if (m){ m.favorite=!m.favorite; Storage.upsertMelody(m); render(); } return; }
  if (action === 'library:filter') { App.libFilter.mode = value; render(); return; }
  if (action === 'library:deleted') { navigate('deleted'); return; }
  if (action === 'library:more') {

      <div class="sheet-item" data-action="sheet:rename" data-id="${id}">✎ Rename</div>
      <div class="sheet-item" data-action="sheet:duplicate" data-id="${id}">⧉ Duplicate</div>
      <div class="sheet-item" data-action="sheet:variation" data-id="${id}">🌱 Create Variation</div>
      <div class="sheet-item" data-action="sheet:protect" data-id="${id}">🛡 Protect My Melody</div>
      <div class="sheet-item" data-action="sheet:export" data-id="${id}">⇩ Export</div>
      <div class="sheet-item danger" data-action="sheet:delete" data-id="${id}">🗑 Delete</div>`);
    return;
  }
  if (action === 'deleted:restore') { Storage.restoreDeleted(id); toast('Restored'); render(); return; }
  if (action === 'deleted:purge') { Storage.purgeDeletedForever(id); toast('Removed permanently'); render(); return; }

  if (action.startsWith('sheet:')) {
    const kind = action.split(':')[1];
    const target = id ? Storage.getMelody(id) : App.current;
    if (kind === 'close') { closeSheet(); return; }
    closeSheet(); if (!target) return;
    if (kind === 'favorite') { target.favorite=!target.favorite; if (target.id) Storage.upsertMelody(target); render(); return; }
    if (kind === 'rename') { openModal(`<h3>Rename melody</h3><input type="text" id="renameField" value="${esc(target.name)}"><div class="btn-row"><button class="btn btn-secondary" style="flex:1" data-action="modal:cancel">Cancel</button><button class="btn btn-primary" style="flex:1" data-action="modal:confirm-rename" data-id="${target.id||''}">Save</button></div>`, null, { autofocus:'renameField' }); return; }
    if (kind === 'duplicate') { const c=MelodyModel.clone(target); c.id=newId('m'); c.name=target.name+' Copy'; c.createdAt=Date.now(); c.updatedAt=Date.now(); c.favorite=false; c.versions=[]; Storage.upsertMelody(c); toast('Duplicated'); render(); return; }
    if (kind === 'variation') { const c=MelodyModel.clone(target); c.id=newId('m'); c.name=target.name+' (Variation)'; c.createdAt=Date.now(); c.updatedAt=Date.now(); c.favorite=false; c.versions=[]; c.originalNotes=JSON.parse(JSON.stringify(target.notes)); Storage.upsertMelody(c); toast('Variation created — the original is untouched'); render(); return; }
    if (kind === 'protect') { if (!target.id) { toast('Save the melody first'); return; } navigate('certificate', { melodyId: target.id }); return; }
    if (kind === 'export') { exportMelodyFile(target); return; }
    if (kind === 'delete') { openModal(`<h3>Delete this melody?</h3><p>It'll move to Recently Deleted, so you can restore it if this was a mistake.</p><div class="btn-row"><button class="btn btn-secondary" style="flex:1" data-action="modal:cancel">Cancel</button><button class="btn btn-danger" style="flex:1" data-action="modal:confirm-delete" data-id="${target.id||''}">Delete</button></div>`, null); return; }
  }

  if (action === 'settings:noise') { App.settings.noiseSuppression=!App.settings.noiseSuppression; Storage.saveSettings(App.settings); render(); return; }
  if (action === 'settings:instrument') { App.settings.instrument=value; Storage.saveSettings(App.settings); render(); return; }
  if (action === 'settings:tempo') { App.settings.tempo=parseInt(value,10); Storage.saveSettings(App.settings); render(); return; }
  if (action === 'settings:theme') { App.settings.theme=value; Storage.saveSettings(App.settings); render(); return; }
  if (action === 'settings:textsize') { App.settings.textSize=value; Storage.saveSettings(App.settings); render(); return; }
  if (action === 'settings:motion') { App.settings.motion=value; Storage.saveSettings(App.settings); render(); return; }
  if (action === 'settings:clear-drafts') { Storage.clearDraft(); toast('Drafts cleared'); return; }
  if (action === 'settings:export-all') { const all = Storage.loadMelodies(); saveOrShowJSON('humtune-melodies.json', JSON.stringify(all,null,2), 'Export data'); return; }
  if (action === 'settings:help') { navigate('help'); return; }
  if (action === 'settings:privacy') { navigate('privacy'); return; }

  if (action === 'cert:export') { if (id) exportOwnershipPackage(id); return; }

  if (action === 'modal:cancel') { closeModal(); return; }
  if (action === 'modal:save-name') { const f=document.getElementById('nameField'); saveWithName(f?f.value.trim():''); return; }
  if (action === 'modal:confirm-rename') { const f=document.getElementById('renameField'); confirmRename(id, f?f.value.trim():''); return; }
  if (action === 'modal:confirm-delete') { confirmDelete(id); return; }
  if (action === 'modal:confirm-restore') { doRestoreOriginal(); return; }

  if (action === 'sheet:close') { closeSheet(); return; }

  if (action === 'onb:skip' || action === 'onb:done') { finishOnboarding(); return; }
  if (action === 'onb:next') { onboardingNext(); return; }

  if (action === 'draft:continue') { resumeDraft(); return; }
  if (action === 'draft:discard') { Storage.clearDraft(); const w=document.getElementById('draftPromptWrap'); if (w) w.remove(); return; }

  if (action === 'unsaved:cancel') { closeModal(); App.pendingNav=null; return; }
  if (action === 'unsaved:discard') {
    closeModal(); Storage.clearDraft(); const p = App.pendingNav; App.pendingNav=null;
    if (p && p.fromPopstate) { history.back(); } else if (p) { doNavigate(p.screen, p.params, p.replace); }

  }

  if (action === 'studio:tab') { App.studioTab = value; render(); return; }
  if (action === 'studio:mute') { const tr=StudioEngine.tracks[id]; StudioEngine.setTrackMute(id, !(tr&&tr.muted)); render(); return; }
  if (action === 'studio:solo') { const tr=StudioEngine.tracks[id]; StudioEngine.setTrackSolo(id, !(tr&&tr.solo)); render(); return; }

  if (action === 'studio:loop-record') {
    App._loopRecording = true; render();
    const dur = Looper.loopDuration; // null for the first layer (free length), fixed for overdubs
    const result = await Looper.recordLayer(dur);
    App._loopRecording = false;
    if (result.error) { toast(result.error); render(); return; }
    Looper.addLayer(result.buffer); toast('Layer added'); render();
    return;
  }
  if (action === 'studio:loop-stop-record') { Looper.stopRecording(); return; }
  if (action === 'studio:loop-play') { Looper.play(); render(); return; }
  if (action === 'studio:loop-stopplay') { Looper.stop(); render(); return; }

  if (action === 'studio:layer-delete') { Looper.removeLayer(id); render(); return; }

  if (action === 'studio:gen-bass') { if (App.current) { App._bassLine = generateBassLine(App.current); render(); } return; }
  if (action === 'studio:gen-chords') { if (App.current) { App._chords = generateChords(App.current); render(); } return; }
  if (action === 'studio:play-bass') {
    if (!App._bassLine) return; StudioEngine.ensure(); const track = StudioEngine.getOrCreateTrack('bass','Bass');
    const t0 = StudioEngine.ctx.currentTime + 0.05;

  }
  if (action === 'studio:play-chords') {

    return;
  }

  if (action === 'studio:vocal-record') {
    App._vocalRecording = true; render();
    const result = await VocalStudio.recordTake();
    App._vocalRecording = false;
    if (result.error) { toast(result.error); render(); return; }
    VocalStudio.addTake(result.buffer); toast('Take recorded'); render();
