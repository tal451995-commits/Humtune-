  }
  if (action === 'studio:vocal-stop-record') { VocalStudio.stopRecording(); return; }
  if (action === 'studio:vocal-play') { VocalStudio.play(id, 1); return; }
  if (action === 'studio:vocal-play-corrected') {
    const take = VocalStudio.takes.find(t=>t.id===id); if (!take) return;
    const rate = suggestVocalCorrectionRate(take, App.current);
    VocalStudio.play(id, rate);
    return;
  }
  if (action === 'studio:vocal-delete') { VocalStudio.deleteTake(id); render(); return; }

  if (action === 'studio:fx-toggle') {
    const e = StudioEngine.effects[id]; const on = !e.on;
    if (id==='filter') StudioEngine.setFilter(on, e.freq, e.type);
    if (id==='distortion') StudioEngine.setDistortion(on, e.amount);
    if (id==='delay') StudioEngine.setDelay(on, e.wet, e.time, e.feedback);
    if (id==='reverb') StudioEngine.setReverb(on, e.wet);
    render(); return;
  }
  } catch (err) {
    console.error('HumTune action failed:', action, err);
    toast('Something went wrong with that action — please try again.');
  }
});

document.body.addEventListener('input', (e) => {
  const t = e.target.closest('[data-action-input]'); if (!t) return;
  const action = t.dataset.actionInput, id = t.dataset.id, val = parseFloat(t.value);
  try {
    if (action === 'studio:volume') { StudioEngine.setTrackVolume(id, val); return; }
    if (action === 'studio:master-volume') { StudioEngine.setMasterVolume(val); return; }
    if (action === 'studio:layer-volume') { Looper.setLayerVolume(id, val); return; }
    if (action === 'studio:drum-bpm') { DrumMachine.bpm = val; const disp = document.getElementById('drumBpmDisplay'); if (disp) disp.textContent = val; return; }
    if (action === 'studio:fx-filter-freq') { const e2 = StudioEngine.effects.filter; StudioEngine.setFilter(e2.on, val, e2.type); return; }
    if (action === 'studio:fx-dist-amount') { const e2 = StudioEngine.effects.distortion; StudioEngine.setDistortion(e2.on, val); return; }
    if (action === 'studio:fx-delay-wet') { const e2 = StudioEngine.effects.delay; StudioEngine.setDelay(e2.on, val, e2.time, e2.feedback); return; }
    if (action === 'studio:fx-reverb-wet') { const e2 = StudioEngine.effects.reverb; StudioEngine.setReverb(e2.on, val); return; }
  } catch (err) { console.error('HumTune slider action failed:', action, err); }
});

function exportMelodyFile(m) { saveOrShowJSON((m.name||'melody').replace(/[^a-z0-9\- _]/gi,'').trim()+'.json', melodyToJSON(m), 'Export melody'); }
function saveWithName(name) { const m=App.current; m.id=newId('m'); m.name=name||defaultMelodyName(); m.createdAt=Date.now(); m.updatedAt=Date.now(); m.draft=false; Storage.upsertMelody(m); Storage.clearDraft(); App.savedRef=MelodyModel.clone(m); closeModal(); toast('Melody saved'); render(); }
function confirmRename(id, name) { if (!name) { closeModal(); return; } if (id) { const m=Storage.getMelody(id); if (m) { m.name=name; m.updatedAt=Date.now(); Storage.upsertMelody(m); } } else if (App.current) { App.current.name=name; autosaveIfUnsaved(); } closeModal(); toast('Renamed'); render(); }
function confirmDelete(id) {
  if (id) { Storage.softDeleteMelody(id); toast('Deleted'); closeModal(); navigate('library', {}, true); }
  else { App.current=null; Storage.clearDraft(); closeModal(); toast('Deleted'); navigate('home', {}, true); }
}
function openMelodyById(id) {
  const m = Storage.getMelody(id); if (!m) return;
  App.current = MelodyModel.clone(m); App.savedRef = MelodyModel.clone(m);
  App.undoStack=[]; App.redoStack=[]; App.selectedNoteId=null; App.editorView='roll'; App.previewOriginal=false;
  navigate('editor', { fresh:false });
}

/* =====================================================================
   ONBOARDING
===================================================================== */
const ONB_SLIDES = [
  { ico:'🎵', h:'Have a melody in your head?', p:'Everyone does, even without musical training.' },
  { ico:'🎙️', h:'Hum it.', p:'Just hum or sing it into your phone — no perfect pitch required.' },
  { ico:'🎹', h:'Turn it into music.', p:'HumTune finds the notes and plays them back so you can build on the idea.' }
];
let onbIndex = 0;
function renderOnboarding() {
  const el = document.getElementById('onboarding'); const s = ONB_SLIDES[onbIndex];
  el.innerHTML = `<button class="onb-skip" data-action="onb:skip">Skip</button>
    <div class="onb-body"><div class="ico">${s.ico}</div><h2>${esc(s.h)}</h2><p>${esc(s.p)}</p></div>
    <div class="onb-dots">${ONB_SLIDES.map((_,i)=>`<span class="${i===onbIndex?'on':''}"></span>`).join('')}</div>
    <div class="onb-footer"><button class="btn btn-primary btn-block" data-action="${onbIndex===ONB_SLIDES.length-1?'onb:done':'onb:next'}">${onbIndex===ONB_SLIDES.length-1?'Get Started':'Next'}</button></div>`;
}
function onboardingNext(){ onbIndex = Math.min(ONB_SLIDES.length-1, onbIndex+1); renderOnboarding(); }
function finishOnboarding(){ Storage.setOnboarded(); document.getElementById('onboarding').hidden = true; }

/* =====================================================================
   DRAFT RESUME PROMPT
===================================================================== */
function maybeShowDraftPrompt() {
  const draft = Storage.loadDraft(); if (!draft || !draft.notes || !draft.notes.length) return;
  const wrap = document.createElement('div'); wrap.id='draftPromptWrap'; wrap.className='card'; wrap.style.margin='12px 16px 0';
  wrap.innerHTML = `<div style="font-weight:700;margin-bottom:4px">Continue your melody?</div><div style="color:var(--text-dim);font-size:0.82rem;margin-bottom:12px">You have an unsaved melody from earlier.</div><div class="btn-row"><button class="btn btn-secondary" style="flex:1" data-action="draft:discard">Discard</button><button class="btn btn-primary" style="flex:1" data-action="draft:continue">Continue</button></div>`;
  document.getElementById('app').insertBefore(wrap, document.getElementById('bottom-nav'));
}
function resumeDraft() {
  const draft = Storage.loadDraft(); if (!draft) return;
  App.current = draft; App.savedRef = null; App.undoStack=[]; App.redoStack=[]; App.selectedNoteId=null; App.editorView='roll'; App.previewOriginal=false;
  navigate('editor', { fresh:false });
}

/* =====================================================================
   BOOTSTRAP
===================================================================== */
function logoSvg(size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <rect width="32" height="32" rx="9" fill="#0f2417"/>
    <rect x="7" y="14" width="3" height="8" rx="1.5" fill="#35e07a"/>
    <rect x="12" y="9" width="3" height="18" rx="1.5" fill="#35e07a"/>
    <rect x="17" y="12" width="3" height="12" rx="1.5" fill="#35e07a" opacity="0.85"/>
    <rect x="22" y="16" width="3" height="6" rx="1.5" fill="#35e07a" opacity="0.6"/>
  </svg>`;
}
if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if (App.settings.theme==='system') render(); });
  window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', ()=>{ if (App.settings.motion==='system') render(); });
}

applyTheme();
history.replaceState({ screen:'home', params:{} }, '', '#home');
render();
maybeShowDraftPrompt();
if (!Storage.isOnboarded()) { document.getElementById('onboarding').hidden = false; renderOnboarding(); }

})();
</script>
</body>
</html>
